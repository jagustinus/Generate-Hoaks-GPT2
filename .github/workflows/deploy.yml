name: Build and Deploy Project D

on:
  push:
    branches:
      - deploy

env:
  IMAGE_NAME: ghcr.io/jagustinus/generate-hoaks-gpt2

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }} 
          password: ${{ secrets.GHCR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}


  deploy_to_droplet:
    needs: build_and_push
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to Droplet via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e

            DEPLOY_DIR="${{ secrets.DEPLOY_PATH }}"
            
            echo "Setting up deployment directory: $DEPLOY_DIR"
            sudo mkdir -p "$DEPLOY_DIR"
            sudo chown ${{ secrets.DROPLET_USER }}:${{ secrets.DROPLET_USER }} "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            ssh-keyscan github.com >> ~/.ssh/known_hosts

            # Check if repo exists, then clone it or pull the latest version
            if [ -d ".git" ]; then
              echo "Repository exists. Pulling latest changes..."
              git fetch origin
              
              git reset --hard origin/deploy
            else
              echo "Cloning repository for the first time..."
              git clone git@github.com:jagustinus/Generate-Hoaks-GPT2.git .
            fi


            # Now that docker-compose.yml is on the server, we can proceed.
            echo "Logging into GHCR and pulling new image..."
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin
            docker pull ${{ env.IMAGE_NAME }}:latest
            
            echo "Starting application with Docker Compose..."
            # Using --force-recreate to ensure the new image is used
            docker compose up -d --force-recreate
            
            echo "Pruning old Docker images..."
            docker image prune -f

            echo "✅ Project D deployment completed successfully!"