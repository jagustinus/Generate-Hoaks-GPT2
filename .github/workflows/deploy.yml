name: Build and Deploy Project D

on:
  push:
    branches:
      - deploy

env:
  IMAGE_NAME: ghcr.io/jagustinus/generate-hoaks-gpt2

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }} 
          password: ${{ secrets.GHCR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}


  deploy_to_droplet:
    needs: build_and_push
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to Droplet via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # Exit immediately if any command fails
            set -e

            # Navigate to the deployment directory for this specific project
            cd ${{ secrets.DEPLOY_PATH }}
            
            # Log in to the GitHub Container Registry from the server
            echo "Logging into GHCR..."
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin
            
            # Pull the latest version of the image from the registry
            echo "Pulling latest image: ${{ env.IMAGE_NAME }}:latest"
            docker pull ${{ env.IMAGE_NAME }}:latest
            
            # Restart the service using the new image.
            # The 'docker-compose.yml' file on your server defines the service.
            echo "Restarting Docker Compose service..."
            docker compose up -d
            
            # Clean up any old, unused Docker images to save disk space
            echo "Pruning old images..."
            docker image prune -f

            echo "✅ Project D deployment completed successfully!"